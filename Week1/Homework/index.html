<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="이보성 홈페이지" />
  <title>이보성 홈페이지</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <!-- 1. 헤더 -->
  <header class="site-header">
    <div class="header-cell header-start">
      <span class="avatar">B.</span>
    </div>
    <div class="header-cell header-center">
      <h1 class="site-title">이보성</h1>
    </div>
    <div class="header-cell header-end">
      <span class="social-link">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor"
            d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.68.08-.68 1.13.08 1.73 1.16 1.73 1.16 1 .1.68 2.03 2.22 2.03.42 0 .8-.05 1.14-.16.1-.73.4-1.22.72-1.5-2.48-.28-5.08-1.24-5.08-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.3-2.6 5.25-5.1 5.52.41.36.78 1.08.78 2.18v3.23c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z" />
        </svg>
      </span>
      <span class="social-link text-icon">W.</span>
    </div>
  </header>

  <div class="page-layout">
    <!-- 2. 사이드 목차 -->
    <aside class="side-nav">
      <nav>
        <ul>
          <li><a href="#photo-dump">포토 덤프</a></li>
          <li><a href="#gallery">사진첩</a></li>
          <li><a href="#interests">관심사</a></li>
          <li><a href="#webtory">To. 웹토리</a></li>
        </ul>
      </nav>
    </aside>

    <main>
      <!-- 3. 포토 덤프 -->
      <section class="section content-section" id="photo-dump">
        <div class="section-heading">
          <h2>포토 덤프</h2>
        </div>
        <div class="photo-dump">
          <figure class="dump-photo">
            <img src="./images/image_1.png" alt="마이 케미컬 로맨스 음반과 배지 컬렉션" />
          </figure>
          <figure class="dump-photo">
            <img src="./images/image_2.png" alt="a-ha 멤버들이 인쇄된 음반 표지" />
          </figure>
          <figure class="dump-photo">
            <img src="./images/MCR_Poster.png" alt="마이 케미컬 로맨스 Long Live The Black Parade 투어 포스터" />
          </figure>
          <figure class="dump-photo">
            <img src="./images/image_3.png" alt="레코드 스토어에 진열된 음반" />
          </figure>
          <figure class="dump-photo">
            <img src="./images/image_4.png" alt="마이 케미컬 로맨스의 Three Cheers for Sweet Revenge 음반 표지" />
          </figure>
          <figure class="dump-photo">
            <img src="./images/Live_in_Texas.png" alt="무대 위의 제라드 웨이" />
          </figure>
        </div>
      </section>

      <!-- 4. 사진첩 -->
      <section class="section content-section" id="gallery">
        <div class="section-heading">
          <h2>사진첩</h2>
        </div>
        <div class="gallery-track">
          <figure class="gallery-item">
            <img src="./images/image_1.png" alt="마이 케미컬 로맨스 음반과 배지 컬렉션" loading="lazy" />
            <figcaption>음악이 있는 책상</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="./images/image_2.png" alt="a-ha 멤버들이 인쇄된 음반 표지" loading="lazy" />
            <figcaption>오래 듣고 싶은 음반</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="./images/image_3.png" alt="레코드 스토어에 진열된 음반" loading="lazy" />
            <figcaption>레코드 스토어</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="./images/image_4.png" alt="마이 케미컬 로맨스의 Three Cheers for Sweet Revenge 음반 표지" loading="lazy" />
            <figcaption>앨범</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="./images/Live_in_Texas.png" alt="무대 위의 제라드 웨이" loading="lazy" />
            <figcaption>라이브의 순간</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="./images/LongLive_BlackParade.png" alt="마이 케미컬 로맨스 The Black Parade 2026 포스터" loading="lazy" />
            <figcaption>In InCheon 2026 November</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="./images/MCR_Poster.png" alt="마이 케미컬 로맨스 Long Live The Black Parade 투어 포스터" loading="lazy" />
            <figcaption>포스터</figcaption>
          </figure>
        </div>
      </section>

      <!-- 5. 관심사 -->
      <section class="section content-section" id="interests">
        <div class="section-heading">
          <h2>관심사</h2>
        </div>
        <div class="interest-grid">
          <article class="interest-card">
            <img src="./images/image_1.png" alt="마이 케미컬 로맨스 음반과 배지 컬렉션" loading="lazy" />
            <div class="card-body">
              <h3>MCR</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
          <article class="interest-card">
            <img src="./images/image_2.png" alt="a-ha 멤버들이 인쇄된 음반 표지" loading="lazy" />
            <div class="card-body">
              <h3>a-ha</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
          <article class="interest-card">
            <img src="./images/image_3.png" alt="레코드 스토어에 진열된 음반" loading="lazy" />
            <div class="card-body">
              <h3>레코드 스토어</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
          <article class="interest-card">
            <img src="./images/image_4.png" alt="마이 케미컬 로맨스의 Three Cheers for Sweet Revenge 음반 표지" loading="lazy" />
            <div class="card-body">
              <h3>명반</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
          <article class="interest-card">
            <img src="./images/Live_in_Texas.png" alt="무대 위의 제라드 웨이" loading="lazy" />
            <div class="card-body">
              <h3>Gerard Way</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
          <article class="interest-card">
            <img src="./images/LongLive_BlackParade.png" alt="마이 케미컬 로맨스 The Black Parade 2026 포스터" loading="lazy" />
            <div class="card-body">
              <h3>In InCheon 2026 November</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
          <article class="interest-card">
            <img src="./images/MCR_Poster.png" alt="마이 케미컬 로맨스 Long Live The Black Parade 투어 포스터" loading="lazy" />
            <div class="card-body">
              <h3>포스터</h3>
            </div>
            <div class="card-actions">
              <button type="button">좋아요</button>
              <button type="button">다음에</button>
            </div>
          </article>
        </div>
      </section>

      <section class="section letter-section" id="webtory">
        <h2>To. 웹토리</h2>
        <p class="letter-decorated">
          아직 웹이 낯설지만, 하나씩 익혀보겠습니다.
        </p>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <span>© 2026 이보성</span>
  </footer>
</body>

</html>
